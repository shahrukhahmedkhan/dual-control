# Install: pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: swift-format-lint
        name: swift-format lint
        entry: swift format lint --strict --parallel
        language: system
        types: [swift]
