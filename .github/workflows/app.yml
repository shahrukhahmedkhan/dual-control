name: macOS

# macOS minutes are expensive on private repos: only run on PRs that touch the app or the macOS-only code
# (the IPC and shim tests compile to nothing on Linux, so the Linux job cannot cover them).
on:
  pull_request:
    paths:
      - App/**
      - Sources/**
      - Tests/**
      - Package.swift
      - Package.resolved
      - .github/workflows/app.yml

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

# Latest Xcode 26 on the image: a recent Swift 6.2.x, like the swift:6.2 container in ci.yml (swift-log needs it).
env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

jobs:
  build:
    name: App build (macOS)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build
        run: |
          xcodebuild -project App/DualControl.xcodeproj -scheme DualControlApp \
            -configuration Debug CODE_SIGNING_ALLOWED=NO build

  package:
    name: Package tests (macOS)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # The shared-terminal tests drive a real tmux inside the sandbox; DC_REQUIRE_TMUX makes them fail, not skip,
      # if it is missing. Homebrew verifies the bottle's checksum.
      - name: Install tmux
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install tmux
      - name: Test
        env:
          DC_REQUIRE_TMUX: "1"
        run: swift test --parallel
